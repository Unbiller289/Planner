<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        /* Mengatur tampilan input dan tombol dalam satu baris */
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Pengaturan Text Area */
        textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-right: 10px;
            resize: vertical;
        }
        /* Mengatur Tombol */
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background-color: #28a745;
        }
        /*Mengatur daftar catatan*/
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px ;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 5px 10px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Notes</h1>
        <div class="input-container">
            <textarea id="noteInput" placeholder="Tulis Catatan Disini...."></textarea>
            <button id = "addNoteBtn">Add List</button>
        </div>
        <ul id="noteList"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAVxAQVqJnJFlv6Pu_6-fBN6G2uWvp3jp8",
          authDomain: "fir-project-99863.firebaseapp.com",
          projectId: "fir-project-99863",
          storageBucket: "fir-project-99863.firebasestorage.app",
          messagingSenderId: "819931439685",
          appId: "1:819931439685:web:e71e21f00d7ab8710a392c"
        };
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        //Fungsi Tambah Catatan
        document.getElementById("addNoteBtn").addEventListener("click", async () => {
            const noteInput = document.getElementById ("noteInput");
            const noteText = noteInput.value.trim(); //validasi text
            if (noteText) {
                try {
                    await addDoc(collection(db, "notes"), {
                        text: noteText
                    });
                    noteInput.value = "";
                    loadNotes();
                }catch(e){
                    console.error("Gagal menambah catatan: ", e);
                }
            } else {
                alert("Silahkan masukan catatan!");
            }
        });

        // Fungsi Load Semua Catatan yang ada di Database
        async function loadNotes() {
            const noteList = document.getElementById("noteList");
            noteList.innerHTML = "";
            try {
                const querySnapshot = await getDocs(collection(db, "notes"));
                querySnapshot.forEach((docSnap) => {
                    const noteText = docSnap.data().text;
                    const noteId = docSnap.id;
                    const li = document.createElement("li");
                    li.textContent = noteText;
                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "Hapus";
                    deleteBtn.className = "delete-btn";
                    deleteBtn.addEventListener("click", () => deleteNote (noteId, li));
                    li.appendChild(deleteBtn);
                    noteList.appendChild(li);
                });
                } catch (e) {
                console.error("Gagal memuat catatan:", e);
                }
            }

            async function deleteNote (noteId, li) {
                try {
                    await deleteDoc(doc(db, "notes", noteId));
                    li.remove();
                } catch (e) {
                    console.error("Gagal menghapus catatan: ", e);
                }
            }

            window.onload = loadNotes;
    </script>
</body>
</html>
