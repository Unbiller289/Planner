<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js" ></script>
    <script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js" ></script>
    <script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js" ></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .login-form h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;

        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

      <div class="login-container">
        <form action="" id="loginForm" class="login-form">
            <h2>Login Page</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="email" id="username" name="username" placeholder="Masukan Email / Username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukan Password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        // TODO: Add SDKs for Firebase products that you want to use
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        // https://firebase.google.com/docs/web/setup#available-libraries
      
        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAVxAQVqJnJFlv6Pu_6-fBN6G2uWvp3jp8",
          authDomain: "fir-project-99863.firebaseapp.com",
          projectId: "fir-project-99863",
          storageBucket: "fir-project-99863.firebasestorage.app",
          messagingSenderId: "819931439685",
          appId: "1:819931439685:web:e71e21f00d7ab8710a392c"
        };
      
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const email = usernameInput.value;
            const password = passwordInput.value;

            signInWithEmailAndPassword(auth, email, password).then((userCredential) => {
                const user = userCredential.user;
                alert("Login Succesful" + user.email);
                window.location.href = "planner.html";
            }).catch((Error) => {
                alert("Error" + error.message);
            });
        
        });
      </script>
</body>
</html>
